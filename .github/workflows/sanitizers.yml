name: Sanitizers

# Races and memory-ordering bugs do not show up in the -O0 coverage build.
# This workflow hunts them deliberately instead of waiting for a flaky
# coverage run: TSAN/ASAN across the full C+Valk suite plus stress tests,
# and the whole suite again at -O2 where the optimizer and weakly-ordered
# arm64 expose bugs that debug builds hide.

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'stdlib/**'
      - 'testing/**'
      - 'symdb/**'
      - 'Makefile'
      - '.github/workflows/sanitizers.yml'
  push:
    branches:
      - main

jobs:
  sanitize:
    strategy:
      fail-fast: false
      matrix:
        mode: [asan, tsan, opt]
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libuv1-dev libedit-dev libgcc-14-dev
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo ln -sf /usr/lib/gcc/$(gcc -dumpmachine)/14/libbacktrace.a /usr/lib/libbacktrace.a
          echo "LLVM_DIR=/usr/lib/llvm-22/lib/cmake/llvm" >> $GITHUB_ENV
          echo "CC=clang-22" >> $GITHUB_ENV
          echo "CXX=clang++-22" >> $GITHUB_ENV
          echo "/usr/lib/llvm-22/bin" >> $GITHUB_PATH

      # Kernel 6.5+ runners default to 32-bit mmap ASLR entropy, which
      # breaks TSAN/ASAN shadow memory mapping (spurious crashes at startup).
      - name: Reduce ASLR entropy for sanitizers
        if: matrix.mode != 'opt'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Build interpreter (test runner)
        run: make build

      - name: ASAN tests (C + Valk + stress)
        if: matrix.mode == 'asan'
        run: |
          make test-c-asan
          make test-valk-asan
          make test-stress-asan

      - name: TSAN tests (C + Valk + stress)
        if: matrix.mode == 'tsan'
        run: |
          make test-c-tsan
          make test-valk-tsan
          make test-stress-tsan

      - name: Optimized tests (-O2, C + Valk incl. stress)
        if: matrix.mode == 'opt'
        run: |
          make test-c-opt
          make test-valk-opt

      - name: Upload sanitizer logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sanitizer-logs-${{ matrix.mode }}-${{ matrix.os }}
          path: |
            build/tsan-stress.log*
            build/asan-stress.log*
            build/tsan-stress-stdout.log
            build/asan-stress-stdout.log
          retention-days: 30
          if-no-files-found: ignore
