name: Coverage

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'stdlib/**'
      - 'testing/**'
      - 'lsp/**'
      - 'symdb/**'
      - 'coverage/**'
      - 'check/**'
      - 'quality/**'
      - 'Makefile'
      - '.github/workflows/coverage.yml'
  push:
    branches:
      - main

jobs:
  coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm cmake ninja pkg-config openssl@3 libuv nghttp2
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
      
      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libssl-dev libuv1-dev libedit-dev libgcc-14-dev llvm-18 llvm-18-dev clang-18
          # libbacktrace.a lives under /usr/lib/gcc/<triple>/14/ - symlink so CMake find_library can find it
          sudo ln -sf /usr/lib/gcc/$(gcc -dumpmachine)/14/libbacktrace.a /usr/lib/libbacktrace.a
          # Make clang-18 the default clang so CMake picks it up
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      
      - name: System Info
        run: |
          ulimit -a
          cat /proc/meminfo 2>/dev/null | head -5 || sysctl hw.memsize 2>/dev/null || true
          uname -m

      - name: Build
        run: |
          make build build-coverage
      
      - name: Run Tests (with JUnit XML output)
        env:
          VALK_HEAP_HARD_LIMIT: "2147483648"
        run: |
          build/valk testing/run-tests.valk -- --build-dir build-coverage --junit-dir build/junit --examples
      
      # UAT drives the real LSP server through real neovim. It was previously
      # not run in CI at all, so user-facing LSP regressions could land freely.
      # VALK_UAT_STRICT makes a missing nvim a hard failure rather than a
      # silent skip, which is the whole point of running it here.
      - name: Install Neovim
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y neovim
          else
            brew install neovim
          fi
          nvim --version | head -1

      # Run separately from the step above because that one targets
      # build-coverage, which has no valk-lsp; `make uat` builds and uses
      # build/valk-lsp. JUNIT points at the same directory the other suites
      # report into, so the collector below sees UAT results too.
      - name: Run LSP UAT (JUnit XML output)
        env:
          VALK_UAT_STRICT: "1"
          VALK_UAT_HOVER_BUDGET_MS: "2000"
        run: |
          make uat JUNIT=${{ github.workspace }}/build/junit

      - name: Generate Coverage Report
        env:
          VALK_HEAP_HARD_LIMIT: "2147483648"
        run: |
          make coverage-report
      
      - name: Check Global Mutation Lint
        run: |
          build/valk check/check-no-globals.valk
      
      - name: Workspace Parse Check
        run: |
          make check
      
      - name: Remove expected-failure JUnit
        if: always()
        run: rm -f build/junit/test_test_framework_fail.xml build/junit/test_test_framework_async_fail.xml

      - name: Test Summary
        uses: test-summary/action@v2
        if: always()
        with:
          paths: build/junit/*.xml
          show: fail
      
      - name: Upload JUnit Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-results-${{ matrix.os }}-${{ matrix.arch }}
          path: build/junit/
          retention-days: 30
      
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}-${{ matrix.arch }}
          path: coverage-report/
          retention-days: 30
      
      - name: Upload Coverage to Codecov (optional)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-report/coverage.xml
          flags: ${{ matrix.os }}-${{ matrix.arch }}
          fail_ci_if_error: false
          verbose: true
